<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Velmora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f9fafb;color:#111}
a{color:inherit;text-decoration:none}

/* Login */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-box{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:2rem;width:100%;max-width:320px}
.login-box h1{font-size:1rem;font-weight:600;margin-bottom:1.5rem}
.login-box input{width:100%;border:1px solid #d1d5db;border-radius:4px;padding:.625rem .75rem;font-size:.875rem;outline:none;margin-bottom:.75rem}
.login-box input:focus{border-color:#f97316}
.login-box button{width:100%;background:#f97316;color:#fff;border:none;border-radius:4px;padding:.625rem;font-size:.875rem;font-weight:500;cursor:pointer}
.login-box button:hover{background:#ea6c0a}
.login-box button:disabled{opacity:.6;cursor:default}
.err{color:#dc2626;font-size:.875rem;margin-bottom:.5rem}

/* App */
#app{display:none;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:.875rem;font-weight:600}
header p{font-size:.75rem;color:#9ca3af;margin-top:2px}
header a{font-size:.875rem;color:#9ca3af}
header a:hover{color:#374151}

/* Stats */
.stats{background:#fff;border-bottom:1px solid #e5e7eb;padding:.625rem 1rem;display:flex;gap:.5rem;overflow-x:auto}
.stat-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:.5rem .875rem;border-radius:6px;border:1px solid #e5e7eb;cursor:pointer;font-size:.75rem;color:#6b7280;transition:border-color .15s}
.stat-card:hover{border-color:#d1d5db}
.stat-card.active{border-color:#fb923c;background:#fff7ed;color:#c2410c}
.stat-card strong{font-size:.9rem;font-weight:700;color:#111}
.stat-new{color:#f97316;font-weight:500;margin-top:1px}

/* Filters */
.filters{background:#fff;border-bottom:1px solid #e5e7eb;display:flex;overflow-x:auto}
.filters button{padding:.75rem 1rem;font-size:.875rem;font-weight:500;white-space:nowrap;border:none;background:none;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent}
.filters button:hover{color:#111}
.filters button.active{color:#f97316;border-bottom-color:#f97316}

/* Table */
.wrap{padding:1rem 1.5rem}
.empty{text-align:center;padding:5rem 0;color:#9ca3af;font-size:.875rem}
.tbl-wrap{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow-x:auto}
table{width:100%;font-size:.875rem;min-width:720px;border-collapse:collapse}
thead tr{background:#f9fafb;border-bottom:1px solid #e5e7eb}
th{text-align:left;padding:.625rem 1rem;font-size:.7rem;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
tbody tr{border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s}
tbody tr:hover{background:#f9fafb}
tbody tr.expanded{background:#fff7ed}
td{padding:.625rem 1rem;vertical-align:middle}
.mono{font-family:monospace;font-size:.7rem;background:#f3f4f6;color:#4b5563;padding:.125rem .375rem;border-radius:3px}
.mkt{font-family:monospace;font-size:.7rem;background:#1f2937;color:#fff;padding:.125rem .375rem;border-radius:3px}
.badge{display:inline-block;padding:.125rem .5rem;border-radius:9999px;font-size:.7rem;font-weight:500}
.badge-new{background:#ffedd5;color:#c2410c}
.badge-called{background:#dbeafe;color:#1d4ed8}
.badge-done{background:#dcfce7;color:#166534}
.badge-declined{background:#fee2e2;color:#dc2626}
.dim{color:#d1d5db}

/* Edit panel */
.edit-row td{background:#fff7ed;border-top:1px solid #fed7aa;padding:.875rem 1rem}
.edit-inner{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.875rem}
.edit-inner label{font-size:.7rem;color:#9ca3af;display:block;margin-bottom:.25rem}
.edit-inner select,.edit-inner textarea{border:1px solid #d1d5db;border-radius:4px;padding:.375rem .5rem;font-size:.875rem;background:#fff;outline:none}
.edit-inner select:focus,.edit-inner textarea:focus{border-color:#f97316}
.edit-inner textarea{resize:none;flex:1;min-width:180px}
.btn-save{background:#f97316;color:#fff;border:none;border-radius:4px;padding:.375rem .875rem;font-size:.875rem;font-weight:500;cursor:pointer}
.btn-save:hover{background:#ea6c0a}
.btn-save:disabled{opacity:.6}
.btn-cancel{background:none;border:none;color:#9ca3af;font-size:.875rem;cursor:pointer;padding:.375rem .5rem}
.btn-cancel:hover{color:#374151}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>Вхід у CRM</h1>
    <div id="login-err" class="err" style="display:none"></div>
    <input type="password" id="pw" placeholder="Пароль" autofocus>
    <button id="btn-login">Увійти</button>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <h1>CRM · Замовлення</h1>
      <p id="hdr-sub"></p>
    </div>
    <a href="#" id="btn-logout">Вийти →</a>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button class="active" data-f="">Всі</button>
    <button data-f="new">Нові</button>
    <button data-f="called">Передзвонено</button>
    <button data-f="done">Виконано</button>
    <button data-f="declined">Відмова</button>
  </div>

  <div class="wrap">
    <div id="loading" class="empty">Завантаження...</div>
    <div id="empty" class="empty" style="display:none">Замовлень немає</div>
    <div class="tbl-wrap" id="tbl-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Дата</th><th>Ринок</th><th>Звідки</th>
            <th>Ім'я</th><th>Телефон</th><th>Продукт</th><th>Сума</th><th>Статус</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const STATUS = {new:'Нове',called:'Передзвонено',done:'Виконано',declined:'Відмова'};
const BADGE = {new:'badge-new',called:'badge-called',done:'badge-done',declined:'badge-declined'};

let statusFilter = '', subdomainFilter = '', expanded = null, statsData = [];

function shortHost(h){
  const m = h.match(/[^a-z0-9](no|ro|de|ru|en)([^a-z0-9]|$)/i) || h.match(/^(no|ro|de|ru|en)\./i);
  if(m) return m[1].toUpperCase();
  return h.split('.')[0].toUpperCase();
}
function fmtDate(dt){
  const d = new Date(dt.endsWith('Z')?dt:dt+'Z');
  return d.toLocaleString('uk-UA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// --- Auth ---
async function doLogin(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Вхід...';
  err.style.display='none';
  const res = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(res.ok){ showApp(); }
  else{ err.textContent='Невірний пароль'; err.style.display='block'; btn.disabled=false; btn.textContent='Увійти'; }
}

document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-logout').addEventListener('click',async e=>{
  e.preventDefault();
  await fetch('/api/admin/logout');
  location.href='/crm.html';
});

// --- Stats ---
async function loadStats(){
  const res = await fetch('/api/admin/stats');
  if(!res.ok) return;
  statsData = await res.json();
  renderStats();
  updateHeader();
}

function renderStats(){
  const el = document.getElementById('stats');
  let html = `<div class="stat-card ${subdomainFilter===''?'active':''}" data-sd="">
    <strong>${statsData.reduce((s,r)=>s+r.total,0)}</strong><span>Всі</span>
    ${statsData.reduce((s,r)=>s+r.new_count,0)>0?`<span class="stat-new">+${statsData.reduce((s,r)=>s+r.new_count,0)} нових</span>`:''}
  </div>`;
  statsData.forEach(s=>{
    html+=`<div class="stat-card ${subdomainFilter===s.subdomain?'active':''}" data-sd="${esc(s.subdomain)}">
      <strong>${s.total}</strong><span class="mono">${shortHost(s.subdomain)}</span>
      ${s.new_count>0?`<span class="stat-new">+${s.new_count} нових</span>`:''}
    </div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.stat-card').forEach(c=>c.addEventListener('click',()=>{
    subdomainFilter=c.dataset.sd; expanded=null; renderStats(); loadOrders();
  }));
}

function updateHeader(){
  const totalNew=statsData.reduce((s,r)=>s+r.new_count,0);
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('hdr-sub').textContent=`${totalNew} нових`;
}

// --- Orders ---
async function loadOrders(){
  document.getElementById('loading').style.display='block';
  document.getElementById('tbl-wrap').style.display='none';
  document.getElementById('empty').style.display='none';
  const p=new URLSearchParams();
  if(statusFilter) p.set('status',statusFilter);
  if(subdomainFilter) p.set('subdomain',subdomainFilter);
  const res=await fetch('/api/admin/orders'+(p.size?'?'+p:''));
  if(res.status===401){ location.href='/crm.html'; return; }
  const orders=await res.json();
  document.getElementById('loading').style.display='none';
  if(!orders.length){ document.getElementById('empty').style.display='block'; return; }
  document.getElementById('tbl-wrap').style.display='block';
  renderOrders(orders);
}

function renderOrders(orders){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  orders.forEach(o=>{
    const tr=document.createElement('tr');
    if(expanded===o.id) tr.className='expanded';
    tr.innerHTML=`
      <td style="color:#9ca3af;font-size:.75rem">${o.id}</td>
      <td style="color:#4b5563;white-space:nowrap">${fmtDate(o.created_at)}</td>
      <td><span class="mkt">${shortHost(o.subdomain||'')}</span></td>
      <td><span class="mono">${esc(o.source)}</span></td>
      <td style="font-weight:500">${esc(o.name)||'<span class="dim">—</span>'}</td>
      <td>${o.phone?`<a href="tel:${esc(o.phone)}" onclick="event.stopPropagation()">${esc(o.phone)}</a>`:'<span class="dim">—</span>'}</td>
      <td style="color:#4b5563;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.product)||'<span class="dim">—</span>'}</td>
      <td style="font-weight:500;white-space:nowrap">${o.total!=null?o.total+' '+(o.currency||''):'<span class="dim">—</span>'}</td>
      <td><span class="badge ${BADGE[o.status]}">${STATUS[o.status]}</span></td>`;
    tr.addEventListener('click',()=>{ expanded=expanded===o.id?null:o.id; renderOrders(orders); });
    tbody.appendChild(tr);

    if(expanded===o.id){
      const er=document.createElement('tr');
      er.className='edit-row';
      er.innerHTML=`<td colspan="9">
        <div class="edit-inner">
          ${o.email?`<div><label>Email</label><a href="mailto:${esc(o.email)}">${esc(o.email)}</a></div>`:''}
          <div><label>Статус</label>
            <select id="es-${o.id}">
              ${Object.entries(STATUS).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}
            </select>
          </div>
          <div style="flex:1;min-width:180px"><label>Нотатки</label>
            <textarea id="en-${o.id}" rows="2" style="width:100%">${esc(o.notes||'')}</textarea>
          </div>
          <div style="display:flex;align-items:flex-end;gap:.5rem;padding-bottom:2px">
            <button class="btn-save" id="save-${o.id}">Зберегти</button>
            <button class="btn-cancel" id="cancel-${o.id}">Скасувати</button>
          </div>
        </div></td>`;
      tbody.appendChild(er);

      document.getElementById(`save-${o.id}`).addEventListener('click',async()=>{
        const btn=document.getElementById(`save-${o.id}`);
        btn.disabled=true; btn.textContent='Збереження...';
        await fetch(`/api/admin/orders/${o.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({status:document.getElementById(`es-${o.id}`).value,notes:document.getElementById(`en-${o.id}`).value})});
        expanded=null;
        loadStats();
        loadOrders();
      });
      document.getElementById(`cancel-${o.id}`).addEventListener('click',()=>{ expanded=null; renderOrders(orders); });
    }
  });
}

// --- Filters ---
document.getElementById('filters').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    statusFilter=btn.dataset.f; expanded=null; loadOrders();
  });
});

// --- Init ---
async function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await loadStats();
  await loadOrders();
}

// Check if already logged in
fetch('/api/admin/orders?_check=1').then(r=>{ if(r.ok||r.status!==401) showApp(); });
</script>
</body>
</html>
